<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>API Control - Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">
    <h2>Entrar no Sistema</h2>
    <form id="loginForm">
        <div class="input-group">
            <label>E-mail:</label>
            <input type="email" id="email" required placeholder="Digite seu e-mail">
        </div>
        <div class="input-group">
            <label>Senha:</label>
            <input type="password" id="senha" required placeholder="Digite sua senha">
        </div>
        <button type="submit">Entrar</button>
        <p>Não tem uma conta? <a href="cadastro.html" style="color: #04d361;">Cadastre-se aqui</a></p>
    </form>
    <p id="mensagemErro" class="erro"></p>
</div>

<script src="./index.js"></script>
</body>
</html>
