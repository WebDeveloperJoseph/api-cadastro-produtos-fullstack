<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>API Control - Produtos</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container amplo">
    <div class="header-acoes">
        <h2>Painel de Produtos</h2>
        <button onclick="logout()" class="btn-sair">Sair</button>
    </div>

    <div class="card">
        <h3>Cadastrar Novo Produto</h3>
        <form id="produtoForm">
            <input type="text" id="nome" placeholder="Nome do Produto" required>
            <input type="number" id="preco" step="0.01" placeholder="Preço (Ex: 1299.90)" required>
            <input type="number" id="quantidade" placeholder="Quantidade em Estoque" required>
            <button type="submit">Salvar Produto</button>
        </form>
    </div>

    <h3>Produtos Cadastrados</h3>
    <div id="listaProdutos" class="grid-produtos">
        <p>Carregando produtos...</p>
    </div>
</div>

<script>
    // Pega o token que foi salvo lá na tela de login
    const token = localStorage.getItem('token_sistema');

    // SEGURANÇA NO FRONT: Se não tiver token, chuta o usuário de volta para o login
    if (!token) {
        window.location.href = 'login.html';
    }

    // Função para buscar os produtos da API
    async function carregarProdutos() {
        try {
            const resposta = await fetch('http://localhost:3000/produtos', {
                method: 'GET',
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            });

            const produtos = await resposta.json();
            const container = document.getElementById('listaProdutos');
            container.innerHTML = ''; // Limpa o texto de carregando

            if (produtos.length === 0) {
                container.innerHTML = '<p>Nenhum produto cadastrado ainda.</p>';
                return;
            }

            // Renderiza cada produto na tela
            produtos.forEach(prod => {
                container.innerHTML += `
                        <div class="produto-card">
                            <h4>${prod.nome}</h4>
                            <p class="preco">R$ ${prod.preco}</p>
                            <p class="qtd">Estoque: ${prod.quantidade} un.</p>
                        </div>
                    `;
            });
        } catch (erro) {
            document.getElementById('listaProdutos').innerHTML = '<p class="erro">Erro ao carregar produtos.</p>';
        }
    }

    // Formulário para criar produto
    document.getElementById('produtoForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const nome = document.getElementById('nome').value;
        const preco = document.getElementById('preco').value;
        const quantidade = document.getElementById('quantidade').value;

        try {
            const resposta = await fetch('http://localhost:3000/produtos', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ nome, preco, quantidade })
            });

            if (resposta.ok) {
                alert('Produto criado com sucesso!');
                document.getElementById('produtoForm').reset(); // Limpa os campos
                carregarProdutos(); // Atualiza a lista na tela na hora!
            } else {
                alert('Erro ao criar produto.');
            }
        } catch (erro) {
            alert('Erro de conexão.');
        }
    });

    function logout() {
        localStorage.removeItem('token_sistema');
        window.location.href = 'login.html';
    }

    // Roda a função assim que a página abre
    carregarProdutos();
</script>
</body>
</html>
