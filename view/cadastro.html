<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>API Control - Cadastrar Usuário</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">
    <h2>Criar Nova Conta</h2>
    <form id="cadastroForm">
        <div class="input-group">
            <label>Nome:</label>
            <input type="text" id="nome" required placeholder="Digite seu nome">
        </div>
        <div class="input-group">
            <label>E-mail:</label>
            <input type="email" id="email" required placeholder="exemplo@email.com">
        </div>
        <div class="input-group">
            <label>Senha:</label>
            <input type="password" id="senha" required placeholder="Crie uma senha forte">
        </div>
        <button type="submit">Cadastrar</button>
    </form>
    <p id="mensagemStatus" class="sucesso"></p>
    <p>Já tem uma conta? <a href="login.html" style="color: #04d361;">Faça Login</a></p>
</div>

<script>
    document.getElementById('cadastroForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const email = document.getElementById('email').value;
        const senha = document.getElementById('senha').value;
        const mensagemStatus = document.getElementById('mensagemStatus');

        try {
            // Dispara o POST para criar o usuário no banco de dados via API
            const resposta = await fetch('http://localhost:3000/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, senha })
            });

            const dados = await resposta.json();

            if (resposta.ok) {
                mensagemStatus.style.color = '#04d361';
                mensagemStatus.textContent = 'Usuário cadastrado com sucesso! Redirecionando...';

                // Espera 2 segundos para o usuário ler a mensagem e joga ele pro login
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
            } else {
                mensagemStatus.style.color = '#f75a68';
                mensagemStatus.textContent = dados.message || 'Erro ao cadastrar.';
            }
        } catch (erro) {
            mensagemStatus.style.color = '#f75a68';
            mensagemStatus.textContent = 'Não foi possível conectar ao servidor.';
        }
    });
</script>
</body>
</html>
