version: '3.8'

services:
  db:
    image: postgres:15
    container_name: postgres_sequelize_estoque
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: estoque_db
    ports:
      - "5432:5432"
    volumes:
      - pg_sequelize_data:/var/lib/postgresql/data

volumes:
  pg_sequelize_data: